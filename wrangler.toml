name = "questlog"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# 화면 파일 (public 폴더)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 기록·알림 구독 저장소. Cloudflare에서 만든 KV의 id로 바꿔주세요.
[[kv_namespaces]]
binding = "QUESTLOG"
id = "REPLACE_WITH_KV_ID"

# 15분마다 알림 발송기 실행
[triggers]
crons = ["*/15 * * * *"]

[vars]
# 알림 서비스에 알리는 연락처. 알림 키는 서버가 처음 실행될 때 스스로 만들어 KV에 보관해요.
VAPID_SUBJECT = "https://github.com/montajuu/questlog"
